<article class="card-dark project-card">
  <div class="project-thumb"><i class="bi {{ project.icon }}"></i></div>
  <div class="project-body">
    <h3 class="h5">
      <a href="{% url 'portfolio:project_detail' project.slug %}" class="project-title-link">{{ project.title }}</a>
    </h3>
    <p class="text-muted-soft">{{ project.summary }}</p>

    <div class="tech-tags">
      {% for tech in project.technologies %}
        <span class="tech-tag">{{ tech }}</span>
      {% endfor %}
    </div>

    <div class="project-footer">
      <a href="{% url 'portfolio:project_detail' project.slug %}" class="link-accent">View details <i class="bi bi-arrow-right"></i></a>
      <div class="project-links">
        <a href="{{ project.github_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ project.title }} source code on GitHub"><i class="bi bi-github"></i></a>
        <a href="{{ project.live_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ project.title }} live demo"><i class="bi bi-box-arrow-up-right"></i></a>
      </div>
    </div>
  </div>
</article>
