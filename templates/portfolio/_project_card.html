<article class="card-dark project-card">
  <div class="project-thumb">
    {% if project.thumbnail %}
      <img src="{{ project.thumbnail.url }}" alt="Screenshot of {{ project.title }}" loading="lazy">
    {% else %}
      <i class="bi bi-code-slash"></i>
    {% endif %}
  </div>
  <div class="project-body">
    <h3 class="h5">
      <a href="{{ project.get_absolute_url }}" class="project-title-link">{{ project.title }}</a>
    </h3>
    <p class="text-muted-soft">{{ project.summary }}</p>

    <div class="tech-tags">
      {% for tech in project.technologies.all %}
        <span class="tech-tag">{{ tech.name }}</span>
      {% endfor %}
    </div>

    <div class="project-footer">
      <a href="{{ project.get_absolute_url }}" class="link-accent">View details <i class="bi bi-arrow-right"></i></a>
      <div class="project-links">
        {% if project.github_url %}
          <a href="{{ project.github_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ project.title }} source code on GitHub"><i class="bi bi-github"></i></a>
        {% endif %}
        {% if project.live_url %}
          <a href="{{ project.live_url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ project.title }} live demo"><i class="bi bi-box-arrow-up-right"></i></a>
        {% endif %}
      </div>
    </div>
  </div>
</article>
