{% extends "dashboard/base.html" %}

{% block title %}Delete {{ object_type }}{% endblock %}

{% block content %}
<div class="card-dark mx-auto text-center" style="max-width: 520px;">
  <div class="card-icon danger-icon"><i class="bi bi-exclamation-triangle"></i></div>
  <h1 class="h4 mb-3">Delete this {{ object_type }}?</h1>
  <p class="text-muted-soft mb-4">
    Are you sure you want to delete <strong class="text-white">"{{ object }}"</strong>?
    This can't be undone.
  </p>
  <form method="post" class="d-flex flex-wrap justify-content-center gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i> Yes, delete</button>
    <a href="{% url cancel_url %}" class="btn btn-outline-accent px-4">Cancel</a>
  </form>
</div>
{% endblock %}
