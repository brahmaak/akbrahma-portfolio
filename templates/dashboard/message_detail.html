{% extends "dashboard/base.html" %}

{% block title %}{{ msg.subject }}{% endblock %}

{% block content %}
<a href="{% url 'dashboard:message_list' %}" class="back-link"><i class="bi bi-arrow-left"></i> All messages</a>

<div class="card-dark" style="max-width: 820px;">
  <h1 class="h4 mb-3">{{ msg.subject }}</h1>
  <div class="d-flex flex-wrap justify-content-between gap-2 pb-3 mb-4 border-bottom">
    <div>
      <strong class="text-white">{{ msg.name }}</strong>
      <span class="text-muted-soft">&lt;<a href="mailto:{{ msg.email }}">{{ msg.email }}</a>&gt;</span>
    </div>
    <span class="small text-muted-soft">{{ msg.created_at|date:"d M Y, H:i" }}</span>
  </div>

  <div class="message-body mb-4">{{ msg.message|linebreaks }}</div>

  <div class="d-flex flex-wrap gap-2">
    <a href="mailto:{{ msg.email }}?subject={{ 'Re: '|add:msg.subject|urlencode }}" class="btn btn-accent">
      <i class="bi bi-reply me-1"></i> Reply by email
    </a>
    <form method="post" action="{% url 'dashboard:message_toggle_read' msg.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-accent"><i class="bi bi-envelope me-1"></i> Mark as unread</button>
    </form>
    <a href="{% url 'dashboard:message_delete' msg.pk %}" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i> Delete</a>
  </div>
</div>
{% endblock %}
